name: Deploy static site (S3)

# Calls the cicd-toolkit reusable static-s3-deploy workflow.
# Cloudflare fronts the bucket (edge routing + cache) — that half ships via
# deploy-cloudflare-worker.yml. There is no CloudFront distribution here.
#
#   push to main             -> prod bucket (kota-homepage-prod)
#   PR labeled `deploy:dev`  -> dev bucket  (kota-homepage-dev)
#   workflow_dispatch        -> manual dev/prod
#
# Blocked on: cicd-toolkit#108 (static-s3-deploy.yml new inputs land on @main when #108 merges)
# Supersedes: #63 (stopgap inline bucket-tag PR)
#
# Repo secrets: AWS_DEPLOY_ROLE_ARN (OIDC), PACKAGES_READ_TOKEN

on:
  push:
    branches: [main]
    paths-ignore: ['worker/**', '**.md', 'LICENSE', 'docs/**']
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy'
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deploy:dev')
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.cfg.outputs.bucket }}
      env: ${{ steps.cfg.outputs.env }}
    steps:
      - id: cfg
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            push)         ENV=prod ;;
            pull_request) ENV=dev ;;
            *)            ENV="${{ inputs.environment || 'dev' }}" ;;
          esac
          BUCKET=$([ "$ENV" = "prod" ] && echo kota-homepage-prod || echo kota-homepage-dev)
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: KotaHusky/cicd-toolkit/.github/workflows/static-s3-deploy.yml@main
    with:
      bucket-name: ${{ needs.resolve.outputs.bucket }}
      build-output-dir: apps/web/out
      npm-scope: '@kotahusky'
      registry-url: 'https://npm.pkg.github.com'
      tags: "Project=homepage Environment=${{ needs.resolve.outputs.env }}"
    secrets:
      role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      packages-read-token: ${{ secrets.PACKAGES_READ_TOKEN }}
