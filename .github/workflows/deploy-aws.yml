name: Deploy static site (S3)

# Builds the Next.js static export and syncs it to the S3 bucket in Kota Web.
# Cloudflare fronts the bucket (edge routing + cache) — that half ships via
# deploy-cloudflare-worker.yml. There is no CloudFront and no ECS here.
#
#   push to main             -> prod bucket (kota-homepage-prod)
#   PR labeled `deploy:dev`  -> dev bucket  (kota-homepage-dev)
#   workflow_dispatch        -> manual dev/prod
#
# Repo var:    AWS_ACCOUNT_ID
# Repo secrets: AWS_DEPLOY_ROLE_ARN (OIDC, main-ref only), PACKAGES_READ_TOKEN

on:
  push:
    branches: [main]
    paths-ignore: ['worker/**', '**.md', 'LICENSE', 'docs/**']
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy'
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deploy:dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve environment + bucket
        id: cfg
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            push)         ENV=prod ;;
            pull_request) ENV=dev ;;
            *)            ENV="${{ inputs.environment || 'dev' }}" ;;
          esac
          BUCKET=$([ "$ENV" = "prod" ] && echo kota-homepage-prod || echo kota-homepage-dev)
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "Deploying $ENV -> s3://$BUCKET"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kotahusky'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci

      - name: Build static export
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        shell: bash
        env:
          BUCKET: ${{ steps.cfg.outputs.bucket }}
        run: |
          # HTML + RSC payloads: short cache; Cloudflare revalidates quickly.
          aws s3 sync apps/web/out/ "s3://${BUCKET}/" --delete \
            --cache-control "public, max-age=60, must-revalidate"
          # Fingerprinted, immutable assets: long cache.
          if [ -d apps/web/out/_next/static ]; then
            aws s3 cp apps/web/out/_next/static "s3://${BUCKET}/_next/static" --recursive \
              --cache-control "public, max-age=31536000, immutable"
          fi
          echo "Synced $(find apps/web/out -type f | wc -l | tr -d ' ') files to s3://${BUCKET}"

      - name: Tag S3 bucket
        shell: bash
        env:
          BUCKET: ${{ steps.cfg.outputs.bucket }}
          ENV: ${{ steps.cfg.outputs.env }}
          REPO: ${{ github.repository }}
        run: |
          aws s3api put-bucket-tagging --bucket "$BUCKET" \
            --tagging "TagSet=[{Key=Project,Value=homepage},{Key=Environment,Value=$ENV},{Key=Repository,Value=$REPO}]"
